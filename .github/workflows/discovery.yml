name: Discover research opportunities
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomic-atlas-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run discovery
        run: python scripts/discovery/discover.py
      - name: Upload candidate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genomic-atlas-discovery-${{ github.run_number }}
          path: research/discovery/candidates.jsonl
          if-no-files-found: warn
          retention-days: 30
