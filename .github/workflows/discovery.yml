name: Discover research opportunities

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genomic-atlas-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore discovery history
        uses: actions/cache@v6
        with:
          path: research/discovery/candidates.jsonl
          key: genomic-atlas-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            genomic-atlas-discovery-

      - name: Run discovery
        run: python scripts/discovery/discover.py

      - name: Upload candidate results and run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genomic-atlas-discovery-${{ github.run_number }}
          path: |
            research/discovery/candidates.jsonl
            research/discovery/run_report.json
          if-no-files-found: warn
          retention-days: 30
